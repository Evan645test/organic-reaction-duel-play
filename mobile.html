/* Keep the starter visible for the entire trick, separately from the current actor. */
.trick-guide {
  display:grid; grid-template-columns:minmax(190px,1fr) minmax(340px,1.7fr) minmax(210px,1.1fr);
  align-items:center; gap:20px; margin:0 4px 13px; padding:13px 16px;

}

.trick-guide .trick-counter #start-label { font:600 16px/1.4 'PingFang TC','Microsoft JhengHei',sans-serif; color:#f5dba2; }
.trick-guide .turn-route {
  position:static; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px;
  max-width:none; width:100%; align-items:stretch; justify-content:normal;
}
.trick-guide .route-step {
  position:relative; display:grid; grid-template-columns:23px minmax(0,1fr); grid-template-rows:auto auto;
  align-items:center; column-gap:7px; row-gap:3px; padding:7px 9px;

  <style>
/* The hit lanes stay fixed while the faces rotate and lift over them. */
#hand.fan-tray {
  --fan-width:102px;
  --fan-height:144px;
  --fan-stage:174px;
  --fan-edge:18px;
  --fan-bend:10px;
  --fan-angle:12deg;
  --fan-floor:23px;
  --fan-lift:28px;
  display:grid;
  grid-template:minmax(0,1fr) / minmax(0,1fr);
  place-content:stretch;
  place-items:center;
  height:var(--fan-stage);
  min-height:var(--fan-stage);
  max-height:none;
  width:100%;
  padding:0 var(--fan-edge);
  overflow:visible;
}
.fan-spread {
  position:relative;
  display:grid;
  grid-template-columns:repeat(var(--fan-count),minmax(0,1fr));
  width:min(100%,calc(var(--fan-width) * (.78 * (var(--fan-count) - 1) + 1)));
  height:100%;
}
#hand .fan-pick {
  appearance:none;
  display:block;
  min-width:0;
  min-height:0;
  padding:0;
  margin:0;
  border:0;
  border-radius:4px;
  background:none;
  color:#284f5d;
  font:inherit;
  touch-action:manipulation;
}
#hand .fan-pick:focus-visible { outline:none; }
#hand .fan-name {
  position:absolute;
  inset:auto auto 2px calc(var(--fan-index) * 100% / var(--fan-count));
  width:calc(100% / var(--fan-count) - 3px);
  min-height:20px;
  padding:2px 2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  border:1px solid #c4d7de;
  border-radius:4px;
  background:#f4fafc;
  font-size:11px;
  line-height:1.4;
  text-align:center;
  z-index:22;
  pointer-events:none;
}
#hand .fan-face {
  position:absolute;
  left:calc((var(--fan-index) + .5) * 100% / var(--fan-count));
  bottom:var(--fan-floor);
  width:var(--fan-width);
  height:var(--fan-height);
  margin:0;
  transform-origin:50% 92%;
  transform:translate(-50%,calc(var(--fan-bend) * var(--fan-drop))) rotate(calc(var(--fan-turn) * var(--fan-angle)));
  z-index:calc(var(--fan-index) + 1);
  pointer-events:none;
  transition:transform .18s ease,box-shadow .18s ease;
  --head-h:45px; --foot-h:21px; --index-w:29px; --index-h:25px; --index-size:12px;
  --name-size:10px; --name-top:8px; --type-size:8px; --type-h:12px; --note-size:7px;
}
#hand .fan-pick:is([aria-pressed=true],:focus-visible)>.fan-face {
  transform:translate(-50%,calc(var(--fan-floor) - var(--fan-lift))) rotate(0deg);
  box-shadow:0 0 0 2px #238496,0 7px 16px #193d4f55;
  z-index:19;
}
#hand .fan-pick:is([aria-pressed=true],:focus-visible)>.fan-name {
  border-color:#236f82;
  background:#236f82;
  color:white;
}
#hand .fan-pick:focus-visible>.fan-name { outline:2px solid #2c6a80; outline-offset:2px; }
@media(hover:hover) and (pointer:fine) {
  #hand .fan-spread:has(.fan-pick:hover) .fan-pick:not(:hover)>.fan-face {
    transform:translate(-50%,calc(var(--fan-bend) * var(--fan-drop))) rotate(calc(var(--fan-turn) * var(--fan-angle)));
    z-index:calc(var(--fan-index) + 1);
    box-shadow:0 3px 7px #08282035;
  }
  #hand .fan-pick:hover>.fan-face {
    transform:translate(-50%,calc(var(--fan-floor) - var(--fan-lift))) rotate(0deg);
    box-shadow:0 0 0 2px #7baab9,0 7px 16px #193d4f55;
    z-index:20;
  }
  #hand .fan-pick:hover>.fan-name { border-color:#508c9c; }
}

    openDrawer('rules','用反應改變牌桌','<p>你操作南家，與北家小白同隊。三位電腦只使用各自的手牌與公開資訊。</p><ol><li>每人8張，不補牌。四家每墩各出一張；墩末清桌，先手依座位輪替。牌桌上緣顯示本墩先手與第1～4手，先手座位整墩保留標記。</li><li>手牌是<strong>完整有機原料與具名試劑</strong>。本次新出的原料可直接登記候選，若被反應轉換則看有效產物；每手只確認一種，不逐張累加。</li><li>例如乙醇＋過錳酸鉀生成乙酸；乙醯氯＋乙胺或乙酸＋乙胺都能生成N-乙基乙醯胺，酸與胺包含加熱脫水條件。反應有方向，不能把產物任意反接。</li><li>出牌後自動比對：沒有有效結果換下一家；只有一種自動確認；多種由出牌者選一種，選單不顯示分數。最後補齊反應的玩家取得成果。</li><li>每張原料代表一份材料；反應消耗來源分子，所有產物都留在分子池。選擇只登記計分成果，不會移除其他產物。同級材料競爭時，先用最早進場者；反應優先順序依活性與本版反應表固定，不依分數。水解牌首次遇到適用目標時作用一次，當時適用的目標一併處理，用後不再影響新產物；其他試劑整墩持續有效。已能被繼續反應的結構不能當作終點；相互轉換的循環也不能得分。</li><li>舊成果被後手轉換後失效；其他有效成果可遞補。本手新牌促成、反應結束後仍存在的產物都能選一項登記，即使分數比被消耗的成果低；不能認領無關的既有產物。</li><li>第四家完成選擇後，才公布分數。最高有效成果贏墩，同分先確認者優先。乙烯、乙醯氯與烷類列0分，仍可贏墩；CO₂不屬有機成果，不是0分候選。只把勝出成果分數計入隊伍；烷類仍可贏墩，沒有有效成果則無人得墩。</li><li>八墩後先比總分，再比贏墩數，仍同則平手。</li></ol>'+points+'<p class="muted">本版使用明列的定向反應；未列入不表示化學上不可能。濃硫酸酯化須同時有羧酸與可反應的醇。水解牌已包含各底物的反應條件：乙醯氯遇水即可水解；醯胺需酸性或鹼性水溶液加熱。遊戲不另花牌補條件。催化劑與計量不另計牌；副產物水不自動變成水解牌。</p><div class="drawer-actions"><button class="drawer-action" data-action="close">回到牌桌</button><button class="drawer-secondary" data-action="reactions">看反應表</button></div>');

  function showPairing(who = null, trick = game.trick) {
    if (visualBusy) return;
    if (who !== null && (!Number.isInteger(who) || who < 0 || who > 3)) return;
    const result=game.results.find(r=>r.trick===trick), frame=trick===game.trick?game:result;
    if (!frame) return notify('這墩尚未開始。');
    const revealed=trick<game.trick||scoresRevealed();
    if (trick===game.trick&&revealed) explainedTrick=game.trick;
    const rows=Explain.explain(frame.cards,frame.claims,frame.pending||null).filter(row=>who===null||row.player===who);
    let outcome='<div class="notice">本墩尚未結算。先看配對過程，點數於墩末揭曉。</div>';
    if (revealed&&result) {
      if (result.winner===null) outcome='<div class="notice">本墩沒有仍有效的成果，無人得墩。</div>';
      else {
        const ties=frame.claims.filter(c=>c.valid&&c.player!==result.winner&&G.MOLECULES[c.mol].score===result.points);
        outcome='<div class="notice">'+G.SEATS[result.winner].position+'家以'+esc(G.MOLECULES[result.mol].name)+'勝出，取得 '+result.points+' 分。'+(ties.length?'與'+ties.map(c=>G.SEATS[c.player].position+'家').join('、')+'同分，依先確認者優先。':'')+'</div>';
      }
    }
    const content=rows.map(row=>{
      const mol=row.mol?G.MOLECULES[row.mol]:null, invalidator=frame.cards.find(c=>c.id===row.invalidatedBy);
      const status=mol?!row.valid?'已轉換':revealed?'墩末仍有效':'目前有效':row.pending?'待選擇':'無新成果';
      const materials=row.materials.length?'<div class="pairing-materials"><small>本次配對使用的公共牌</small>'+row.materials.map(m=>'<span class="'+(m.fresh?'fresh':'')+'">'+G.SEATS[m.player].position+'家 '+esc(G.CARDS[m.key].name)+(m.fresh?'・本手':'')+'</span>').join('')+'</div>':'';
      const steps=row.steps.length?'<ol class="pairing-reactions">'+row.steps.map((step,i)=>'<li><small>'+ (i===row.steps.length-1?'產物確認':'中間反應')+(step.reagent?'・'+esc(G.CARDS[step.reagent].name):'')+'</small><p>'+esc(step.text)+'</p></li>').join('')+'</ol>':row.lastStep?'<p class="pairing-reaction">已確認的最後一步：'+esc(row.lastStep)+'</p>':'';
      const affected=row.affected.map(c=>'<p class="pairing-change">本手使'+G.SEATS[c.player].position+'家的'+esc(G.MOLECULES[c.mol].name)+'轉換，原成果失效。<small>'+esc(c.reason)+'</small></p>').join('');
      const current=!row.valid&&invalidator?'<p class="pairing-change">這項成果後來在第'+(frame.cards.findIndex(c=>c.id===invalidator.id)+1)+'手，因'+G.SEATS[invalidator.player].position+'家打出'+esc(G.CARDS[invalidator.key].name)+'而失效。</p>':'';
      return '<article class="pairing-turn" data-explanation-player="'+row.player+'"><header><span class="pairing-order">'+row.order+'</span><div><strong>'+G.SEATS[row.player].position+'家・'+esc(G.SEATS[row.player].name)+'</strong><small>打出 '+esc(G.CARDS[row.cardKey].name)+'</small></div><span class="pairing-state">'+status+'</span></header>'+(mol?'<div class="pairing-result '+(!row.valid?'invalid':'')+'">'+Art.molecule(row.mol)+'<div><strong>'+esc(mol.name)+'</strong>'+(revealed?'<span>'+mol.score+' 分</span>':'')+'</div></div>':'')+'<p>'+esc(row.reason)+'</p>'+materials+steps+affected+current+'</article>';
    }).join('');
    const choose=trick===game.trick&&game.phase==='declare'&&game.active===0?'<button class="drawer-action" data-action="choose-current">選擇產物</button>':'';
    const next=trick===game.trick&&game.phase==='trickEnd'?'<button class="drawer-action" data-action="next-trick">開始第'+(game.trick+1)+'墩・'+G.SEATS[(game.starter+1)%4].position+'家先手</button>':'';
    const results=trick===game.trick&&game.phase==='gameOver'?'<button class="drawer-secondary" data-action="results">查看全局結算</button>':'';
    openDrawer('pairing','第'+trick+'墩・'+(who===null?'逐手配對解釋':G.SEATS[who].position+'家配對解釋'),outcome+(content||'<p>尚未出牌，出牌後會逐手記錄配對原因。</p>')+'<p class="muted">以上依本版反應表呈現一條可成立的路線。來源分子轉換後已消耗，不能再次使用；所有產物都留在分子池，只有選中的一項登記計分。水解牌只作用一次，其他試劑整墩持續。酸與胺的配對包含加熱脫水條件。</p><div class="drawer-actions">'+choose+next+results+'<button class="drawer-secondary" data-action="close">回到實驗桌</button></div>');
  }
  function showHistory() {
    const rounds = [...game.results].reverse().map(r => '<tr><td>' + r.trick + '</td><td>' + (r.winner === null ? '無人得墩' : G.SEATS[r.winner].position + '家・' + G.MOLECULES[r.mol].name) + '</td><td>' + r.points + '</td><td><button class="history-pairing" data-explain-trick="'+r.trick+'">配對解釋</button></td></tr>').join('');
    openDrawer('history', '牌局紀錄', '<p class="muted">牌局種子 ' + game.seed + '・記錄公開出牌、分子配對與已結算結果。</p>' + (rounds ? '<table><thead><tr><th>墩</th><th>勝出成果</th><th>分</th><th>過程</th></tr></thead><tbody>' + rounds + '</tbody></table>' : '') + '<h3>最近動作</h3>' + game.log.map(l => '<div class="log-entry ' + esc(l.type) + '">' + esc(l.text) + '</div>').join(''));
  }
  function showDeclaration() {
    if (visualBusy || !ownTurn() || game.phase !== 'declare') return;
    const options = G.matchingOptions(game);
    if (options.length <= 1) { apply(G.resolveMatches(game)); return; }
    pickedMolecule = null;
    openDrawer('declare', '選擇登記成果', '<p>選一項登記，其他產物仍可反應。分數於墩末揭曉。</p><div class="declaration-grid">' + options.map(id => { const d = G.MOLECULES[id]; return '<button class="molecule-option" data-declare="' + id + '" aria-pressed="false"><strong>' + esc(d.name) + '</strong>' + Art.molecule(id) + '<small>' + esc(d.family) + '</small></button>'; }).join('') + '</div><div class="declare-footer"><p id="declare-error" class="declare-error" role="status" aria-live="polite"></p><button id="confirm-claim" class="drawer-action" data-action="confirm-claim" disabled>先選擇產物</button></div>');
  }
  function commitClaim(mol) {
    try { const next = G.chooseMatch(game, mol); closeDrawer(); selected = null; apply(next); }
    catch (error) { if (drawerKind === 'declare' && $('declare-error')) { $('declare-error').textContent = error.message; $('declare-error').scrollIntoView({ block: 'nearest' }); } else notify(error.message); }
  }
  function showResults() {
    resultShown=true;
    const w = G.winner(game);
    openDrawer('results', w === -1 ? '八墩結束，兩隊平手' : w === 0 ? '你與小白贏了' : '阿青與阿橙贏了', game.teams.map(t => '<div class="result-score"><div><strong>' + esc(t.name) + '</strong><small>贏得 ' + t.tricks + ' 墩</small></div><b>' + t.score + ' 分</b></div>').join('') + '<p class="muted">先比總分，再比贏墩數，兩者相同則平手。</p><div class="drawer-actions"><button class="drawer-action" data-action="new-now">再玩一局</button><button class="drawer-secondary" data-action="history">看牌局紀錄</button><button class="drawer-secondary" data-action="pairing">第8墩配對解釋</button><button class="drawer-secondary" data-action="close">回到牌桌</button></div>');
  }
  function showNew() {
    openDrawer('new', '開始單人新局', '<p>你操作南家，北家電腦小白是搭檔；西家阿青與東家阿橙由電腦自動操作。</p><p>重新發32張牌，兩隊比分與本局紀錄歸零。</p><div class="drawer-actions"><button class="drawer-action" data-action="new-now">發牌，開始單人局</button><button class="drawer-secondary" data-action="close">繼續這一局</button></div>');
  }
  function newGame() { stopAI(); cancelVisuals(); dealPending=true; game = G.makeGame(); selected = null; pickedMolecule = null; plannedMol = undefined; resultShown = false; explainedTrick=null; paused = false; closeDrawer(); persist(); render(); dealHand(); }
  function showWelcome() {
    openDrawer('welcome', '降階登記試玩版', '<p><strong>新規則：</strong>本手形成的有效產物可登記，即使分數比被消耗的成果低。水解仍是兩張、單次作用；後手仍可重新合成醯胺。</p><p>你與電腦小白搭檔。每人八張，每墩依序各出一張。本版使用獨立存檔。</p><div class="notice">出牌後自動配對；有多種成果時選一項登記。等四家都完成後才揭曉分數。</div><div class="drawer-actions"><button class="drawer-action" data-action="tutorial">先看四墩教學</button><button class="drawer-secondary" data-action="close">開始單人遊玩</button><button class="drawer-secondary" data-action="rules">先看規則</button></div>');
  }
  $('primary-btn').addEventListener('click', () => {
    if (visualBusy||orientationBlocked) return;
    if (game.phase === 'gameOver') return showResults();
    if (game.phase === 'trickEnd') { selected = null; return attempt(() => G.nextTrick(game)); }
    if (!ownTurn() || paused) return;
    if (game.phase === 'declare') return showDeclaration();
    if (selected) {
      const id = selected; selected = null;
      attempt(() => {
        const next = G.playMatched(game, id), matched = next.claims.find(c => c.player === 0);
        if (next.phase !== 'declare') notify(matched ? '自動配對：' + G.MOLECULES[matched.mol].name + '。' : ['trickEnd', 'gameOver'].includes(next.phase) ? '本墩已完成，查看結算結果。' : '本次沒有新的合法配對，換下一家。');
        return next;
      });
    }
  });
  $('detail-btn').addEventListener('click', () => { const c = game.players[0].hand.find(c => c.id === selected); if (c) showCard(c.key); });
  $('hand').addEventListener('click', e => {
    const b = e.target.closest('[data-hand]'); if (!b || visualBusy||orientationBlocked) return;
    selected = selected === b.dataset.hand ? null : b.dataset.hand; renderHand(); renderStatus();
  });
  document.addEventListener('click', e => {
    const pairing=e.target.closest('[data-pairing-player]'); if(pairing)return showPairing(Number(pairing.dataset.pairingPlayer));
    const past=e.target.closest('[data-explain-trick]'); if(past)return showReview(Number(past.dataset.explainTrick));
    const card = e.target.closest('[data-card]'); if (card) return showCard(card.dataset.card);
    const tab = e.target.closest('[data-atlas]'); if (tab) return atlas(tab.dataset.atlas);
    const molecule = e.target.closest('[data-declare]');
    if (molecule && drawerKind === 'declare') {
      pickedMolecule = molecule.dataset.declare;
      $('drawer-body').querySelectorAll('[data-declare]').forEach(b => { const on = b.dataset.declare === pickedMolecule; b.classList.toggle('selected', on); b.setAttribute('aria-pressed', String(on)); });
      $('confirm-claim').disabled = false;
      $('confirm-claim').textContent = '登記'+G.MOLECULES[pickedMolecule].name;
      $('declare-error').textContent = ''; return;
    }
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (action === 'tutorial') teaching.start();
    else if (action === 'close') closeDrawer();
    else if (action === 'rules') rules();
    else if (action === 'atlas') atlas();
    else if (action === 'palette') showPalette();
    else if (action === 'new-dialog') showNew();
    else if (action === 'pause-toggle') {closeDrawer();$('pause-btn').click();}
    else if (action === 'reactions') atlas('reactions');
    else if (action === 'history') showHistory();
    else if (action === 'claims') showClaims();
    else if (action === 'sort-hand') {sorted=!sorted;renderHand();closeDrawer();}
    else if (action === 'pairing') showReview();
    else if (action === 'results') showResults();
    else if (action === 'choose-current') showDeclaration();
    else if (action === 'next-trick' && game.phase === 'trickEnd') { closeDrawer(); selected=null; attempt(()=>G.nextTrick(game)); }
    else if (action === 'new-now') newGame();
    else if (action === 'confirm-claim' && pickedMolecule) commitClaim(pickedMolecule);
  });
  $('tutorial-btn').addEventListener('click', () => teaching.start());
  $('rules-btn').addEventListener('click', rules); $('atlas-btn').addEventListener('click', () => atlas());
  $('palette-btn').addEventListener('click', showPalette);
  $('pairing-btn').addEventListener('click', ()=>showReview());
  $('mobile-tools-btn')?.addEventListener('click',showMobileTools);
  $('mobile-records-btn')?.addEventListener('click',()=>{$('live-record').open=!$('live-record').open;});
  $('history-btn').addEventListener('click', showHistory); $('new-btn').addEventListener('click', showNew);
  $('leader-btn').addEventListener('click', showClaims); $('claims-btn').addEventListener('click', showClaims);
  $('close-drawer').addEventListener('click', closeDrawer);
  $('drawer').addEventListener('close', () => { if ($('drawer').open) return; drawerKind = null; if($('tutorial').open)return; renderStatus(); if (drawerOpener?.isConnected) drawerOpener.focus({ preventScroll: true }); else $('primary-btn').focus({ preventScroll: true }); if(dealPending)dealHand();else if(game.phase==='trickEnd'&&explainedTrick!==game.trick||game.phase==='gameOver'&&!resultShown)resumeFlow();else scheduleAI(); });
  $('drawer').addEventListener('click', e => { if (e.target === $('drawer')) { const r = $('drawer').getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeDrawer(); } });
  $('pause-btn').addEventListener('click', () => { paused = !paused; stopAI(); if(visualBusy){cancelVisuals();render();} renderStatus();resumeFlow(); });
  $('sort-btn').addEventListener('click', () => { if(visualBusy)return; sorted = !sorted; renderHand(); });
  addEventListener('pagehide', () => {stopAI();cancelVisuals();render();});
  addEventListener('pageshow', resumeFlow);
  $('review-close').addEventListener('click',()=>$('trick-review').close());
  $('review-next').addEventListener('click',()=>{if(game.phase!=='trickEnd')return;$('trick-review').close();selected=null;attempt(()=>G.nextTrick(game));});
  $('review-results').addEventListener('click',()=>{$('trick-review').close();showResults();});
  $('trick-review').addEventListener('close',()=>{reviewState=null;if(game.phase==='gameOver'&&!resultShown)resumeFlow();else scheduleAI();});
  $('review-steps').addEventListener('click',e=>{const b=e.target.closest('[data-review-step]');if(!b||!reviewState)return;const n=Number(b.dataset.reviewStep);if(n>0&&n<=reviewState.frames.length){reviewState.step=n;renderReview();}});
  document.addEventListener('keydown',e=>{if(orientationBlocked||Pool.isOpen()||!$('trick-review').open||!reviewState||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();reviewState.step=Math.max(1,Math.min(reviewState.frames.length,reviewState.step+(e.key==='ArrowLeft'?-1:1)));renderReview();});
  function updateOrientation(){
    if(!mobileEdition)return;
    orientationBlocked=orientationQuery.matches;
    if(orientationBlocked){stopAI();if(visualBusy){cancelVisuals();render();}if(!$('rotate-prompt').open)$('rotate-prompt').showModal();}
    else{if($('rotate-prompt').open)$('rotate-prompt').close();if(dealPending&&!$('tutorial').open&&!$('drawer').open)dealHand();else resumeFlow();}
  }
  $('rotate-prompt').addEventListener('cancel',e=>{if(orientationBlocked)e.preventDefault();});
  if(orientationQuery.addEventListener)orientationQuery.addEventListener('change',updateOrientation);else orientationQuery.addListener(updateOrientation);
  const teaching = window.OrganicTeachingUI.mount({
    board: reviewBoard,
    blocked: () => orientationBlocked || visualBusy,
    beforeOpen: () => { stopAI(); closeDrawer(); },
    onClose: () => { if(dealPending)dealHand();else resumeFlow(); }
  });
  Pool.bind('offline-live',()=>game);
  Pool.bind('offline-review',()=>reviewState?.frames[reviewState.step-1]);
  document.addEventListener('moleculepoolopen',stopAI);
  document.addEventListener('moleculepoolclose',()=>{renderStatus();resumeFlow();});
  persist(); render();
  if (!restored) { showWelcome(); if (raw) notify('本版存檔無法讀取，已準備新牌局。'); }
  else if (game.phase === 'gameOver') { resultShown = true; showResults(); }
  else if (game.phase === 'declare' && game.active === 0) showDeclaration();
  else if (game.phase === 'trickEnd') showReview();
  else scheduleAI();
  updateOrientation();
})();

</script>
</body>
</html>
